<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Los Aromos - Carta Digital & Pedidos WhatsApp</title>
  <meta name="description" content="Carta digital de Kitchen Los Aromos. Promos de sushi, sushi burgers, hand rolls, sándwiches mechada y smoothies. Pedidos directos a WhatsApp +56979553144." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fuentes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0d10; color: #f3f4f6; }
    .font-luxury { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-24 lg:pb-12">

  <!-- BARRA SUPERIOR -->
  <div class="bg-gradient-to-r from-red-950 via-red-900 to-amber-950 text-red-100 text-xs py-2 px-4 border-b border-red-800/40">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>🔥 Abierto para pedidos: <strong>12:30 a 23:30 hrs</strong> • Parte Alta - Coquimbo / </span>
      </div>
      <div class="flex items-center gap-4 text-xs font-semibold">
        <a href="https://wa.me/56979553144" target="_blank" class="hover:text-white flex items-center gap-1">
          <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-400"></i> +56 9 7955 3144
        </a>
        <a href="https://wa.me/c/56979553144" target="_blank" class="hover:text-amber-300 flex items-center gap-1 underline">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Catálogo WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- CABECERA -->
  <header class="sticky top-0 z-40 bg-[#0d0f14]/95 backdrop-blur-md border-b border-gray-800 py-3 px-4 shadow-lg">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-red-600 to-amber-600 p-[2px]">
          <div class="w-full h-full bg-[#11141a] rounded-[10px] flex items-center justify-center font-luxury font-black text-amber-400">K</div>
        </div>
        <div>
          <span class="text-[10px] uppercase tracking-widest text-amber-500 font-bold block">Los Aromos</span>
          <h1 class="text-base sm:text-lg font-extrabold text-white font-luxury leading-tight">Kitchen & Sushi</h1>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a href="https://wa.me/56979553144" target="_blank" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 text-xs font-semibold hover:bg-emerald-600 hover:text-white transition">
          <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp Directo
        </a>
        <button onclick="toggleCart(true)" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-gradient-to-r from-red-600 to-red-700 text-white font-bold text-xs shadow-lg shadow-red-950 active:scale-95">
          <i data-lucide="shopping-bag" class="w-4 h-4"></i>
          <span>Tu Pedido</span>
          <span id="badge-cart" class="bg-white text-red-700 text-[11px] font-black px-1.5 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BUSCADOR Y CATEGORÍAS -->
  <section class="sticky top-[61px] z-30 bg-[#0d0f14]/95 backdrop-blur-md border-b border-gray-800 py-3 px-4">
    <div class="max-w-6xl mx-auto space-y-3">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input id="search-input" type="text" placeholder="Buscar rolls, promociones, mechada, burger, hand roll..." class="w-full bg-[#161a22] border border-gray-700 rounded-xl pl-10 pr-4 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-red-500" />
      </div>
      <div id="category-pills" class="flex items-center gap-2 overflow-x-auto pb-1 text-xs"></div>
    </div>
  </section>

  <!-- PRODUCTOS -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    <div class="flex items-center justify-between mb-4">
      <h2 id="category-title" class="text-xl font-bold text-white font-luxury">Carta Completa</h2>
      <span id="items-count" class="text-xs text-gray-400"></span>
    </div>
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <!-- CARRITO LATERAL (DRAWER) -->
  <div id="cart-drawer-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden" onclick="toggleCart(false)"></div>
  <div id="cart-drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-md bg-[#11141a] border-l border-gray-800 z-50 flex flex-col shadow-2xl transform translate-x-full transition-transform duration-300">
    <div class="p-4 border-b border-gray-800 flex items-center justify-between bg-[#161a22]">
      <h3 class="font-bold text-white text-base font-luxury">Tu Pedido</h3>
      <button onclick="toggleCart(false)" class="p-1.5 text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="drawer-items" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <div id="cart-footer" class="border-t border-gray-800 bg-[#141820] p-4 space-y-3 hidden">
      <div class="space-y-2 text-xs">
        <div>
          <label class="block text-gray-400 font-medium mb-1">Nombre y Apellido *</label>
          <input id="input-name" type="text" placeholder="Tu nombre" class="w-full bg-[#1b2029] border border-gray-700 rounded-lg px-3 py-2 text-white" />
        </div>
        <div>
          <label class="block text-gray-400 font-medium mb-1">Dirección de entrega (o indicar Retiro)</label>
          <input id="input-address" type="text" placeholder="Calle, villa o depto en Coquimbo" class="w-full bg-[#1b2029] border border-gray-700 rounded-lg px-3 py-2 text-white" />
        </div>
      </div>
      <div class="flex justify-between items-center text-sm font-black text-white pt-2 border-t border-gray-800">
        <span>Total:</span>
        <span id="drawer-total" class="text-lg text-amber-400">$0</span>
      </div>
      <button onclick="sendWhatsAppOrder()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow-lg flex items-center justify-center gap-2">
        <i data-lucide="message-circle" class="w-4 h-4"></i> Enviar Pedido a WhatsApp (+56 9 7955 3144)
      </button>
    </div>
  </div>

  <script>
    const PRODUCTS = [
      { id: 'promo-50', name: 'Promo Kitchen 50 Cortes', cat: 'promos', price: 12990, desc: '10 Pollo cebollín, 10 Pollo pimentón, 10 Pollo palta, 10 Mechada aceituna, 10 Mechada cebollín + 4 salsas.' },
      { id: 'promo-40', name: 'Promo 40 Cortes de Sushi + 4 Salsas', cat: 'promos', price: 10000, desc: '40 cortes calientes en panko y fríos con 4 salsas artesanales.' },
      { id: 'promo-2hand', name: 'Promo 2 Handrolls + 2 Smoothies Frutilla', cat: 'promos', price: 10990, desc: '2 Handrolls fritos en panko con queso crema + 2 batidos de frutilla natural.' },
      { id: 'burger-los-aromos', name: 'Sushi Burger Kitchen Los Aromos', cat: 'burgers', price: 6490, desc: 'Tapas de arroz al panko con pollo teriyaki, palta y queso crema.' },
      { id: 'burger-mechada', name: 'Sushi Burger Mechada Criolla', cat: 'burgers', price: 6990, desc: 'Arroz al panko con tierna carne mechada y cebolla caramelizada.' },
      { id: 'handroll-pollo', name: 'Hand Roll Pollo, Queso & Cebollín', cat: 'handrolls', price: 3690, desc: 'Cono de sushi apanado en panko con abundante relleno.' },
      { id: 'sandwich-mechada', name: 'Sándwich Mechada Luco Brioche', cat: 'sandwiches', price: 6490, desc: 'Carne mechada deshilachada con doble queso fundido en pan brioche.' },
      { id: 'papas-cheddar', name: 'Papas Fritas Cheddar & Tocino', cat: 'sandwiches', price: 5490, desc: 'Papas doradas con abundante queso cheddar caliente y tocino.' },
      { id: 'smoothie-frutilla', name: 'Smoothie Natural de Frutilla 500ml', cat: 'bebidas', price: 3200, desc: 'Batido frappé de frutillas naturales seleccionadas.' }
    ];

    const CATS = [
      { id: 'all', name: 'Toda la Carta' },
      { id: 'promos', name: '🔥 Promociones' },
      { id: 'burgers', name: '🍔 Sushi Burgers' },
      { id: 'handrolls', name: '🥢 Hand Rolls' },
      { id: 'sandwiches', name: '🥪 Sándwiches & Papas' },
      { id: 'bebidas', name: '🥤 Smoothies' }
    ];

    let currentCat = 'all';
    let searchQuery = '';
    let cart = [];

    const formatCLP = n => '$' + n.toLocaleString('es-CL');

    function render() {
      // Categories
      document.getElementById('category-pills').innerHTML = CATS.map(c => `
        <button onclick="setCategory('${c.id}')" class="px-3 py-1.5 rounded-xl border whitespace-nowrap ${currentCat === c.id ? 'bg-red-600 text-white font-bold border-red-500' : 'bg-gray-900 text-gray-300 border-gray-800'}">${c.name}</button>
      `).join('');

      // Products
      let list = PRODUCTS;
      if (currentCat !== 'all') list = list.filter(p => p.cat === currentCat);
      if (searchQuery) list = list.filter(p => p.name.toLowerCase().includes(searchQuery) || p.desc.toLowerCase().includes(searchQuery));

      document.getElementById('items-count').textContent = `${list.length} disponibles`;
      document.getElementById('products-grid').innerHTML = list.map(p => `
        <div class="bg-[#13161c] border border-gray-800 rounded-2xl p-4 flex flex-col justify-between">
          <div>
            <h4 class="font-bold text-white text-sm mb-1">${p.name}</h4>
            <p class="text-xs text-gray-400 mb-3">${p.desc}</p>
          </div>
          <div class="flex items-center justify-between pt-2 border-t border-gray-800/80">
            <span class="text-base font-black text-amber-400">${formatCLP(p.price)}</span>
            <button onclick="addToCart('${p.id}')" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-bold rounded-xl active:scale-95 transition">+ Agregar</button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function setCategory(c) { currentCat = c; render(); }
    function addToCart(id) {
      const p = PRODUCTS.find(x => x.id === id);
      const it = cart.find(x => x.id === id);
      if (it) it.qty++; else cart.push({ ...p, qty: 1 });
      updateCart();
    }
    function updateCart() {
      const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      const count = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('badge-cart').textContent = count;
      document.getElementById('drawer-total').textContent = formatCLP(total);
      const container = document.getElementById('drawer-items');
      const footer = document.getElementById('cart-footer');
      if (cart.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-gray-500 py-8">Tu carrito está vacío</p>';
        footer.classList.add('hidden');
      } else {
        footer.classList.remove('hidden');
        container.innerHTML = cart.map(i => `
          <div class="bg-gray-900 border border-gray-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
            <div><div class="font-bold text-white">${i.name}</div><div class="text-amber-400">${formatCLP(i.price * i.qty)}</div></div>
            <div class="flex items-center gap-1.5"><button onclick="changeQty('${i.id}', -1)" class="w-6 h-6 bg-gray-800 text-white rounded">−</button><span>${i.qty}</span><button onclick="changeQty('${i.id}', 1)" class="w-6 h-6 bg-red-600 text-white rounded">+</button></div>
          </div>
        `).join('');
      }
    }
    function changeQty(id, d) {
      const it = cart.find(x => x.id === id);
      if (!it) return;
      it.qty += d;
      if (it.qty <= 0) cart = cart.filter(x => x.id !== id);
      updateCart();
    }
    function toggleCart(show) {
      const d = document.getElementById('cart-drawer');
      const o = document.getElementById('cart-drawer-overlay');
      if (show) { o.classList.remove('hidden'); setTimeout(() => d.classList.remove('translate-x-full'), 10); }
      else { d.classList.add('translate-x-full'); setTimeout(() => o.classList.add('hidden'), 300); }
    }
    function sendWhatsAppOrder() {
      const name = document.getElementById('input-name').value.trim();
      const addr = document.getElementById('input-address').value.trim();
      if (!name) return alert('Por favor ingresa tu nombre');
      let msg = `🍣 *PEDIDO - KITCHEN LOS AROMOS*\n👤 *Cliente:* ${name}\n📍 *Dirección:* ${addr || 'Retiro en local'}\n\n*Detalle:*\n`;
      cart.forEach((i, idx) => { msg += `${idx + 1}. ${i.qty}x ${i.name} (${formatCLP(i.price * i.qty)})\n`; });
      msg += `\n💰 *TOTAL:* ${formatCLP(cart.reduce((s, i) => s + (i.price * i.qty), 0))}`;
      window.open(`https://wa.me/56979553144?text=${encodeURIComponent(msg)}`, '_blank');
    }

    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value.toLowerCase().trim();
      render();
    });

    render();
    updateCart();
  </script>
</body>
</html>
